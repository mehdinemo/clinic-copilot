[project]
name = "clinic-operations-assistant"
version = "0.1.0"
description = "Clinic Operations Assistant"
readme = "README.md"
authors = [
    { name = "mitty", email = "mehdinemati.nmt@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx[socks]>=0.28.1",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.13",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
